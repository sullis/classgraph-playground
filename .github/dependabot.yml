version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/classgraph5"
      - "/classgraph6"
    schedule:
      interval: "daily"
      time: "04:02"
    open-pull-requests-limit: 20
    ignore:
      # each module is pinned to a classgraph major version (classgraph5 -> 5.x, classgraph6 -> 6.x)
      - dependency-name: "io.github.classgraph:classgraph"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:18"
